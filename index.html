     style = skin / appearance
     script = brain -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CryptoWallet Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js for transaction visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="screen">
    <!-- Dark / Light Mode Toggle -->
    <button id="themeToggle">🌙</button>

    <div class="content">

      <h1>Welcome to,<br><span>CryptoWallet Tracker</span></h1>

      <!-- ================= INPUT SECTION ================= -->
      <div class="input-section">
        <label>Enter Wallet Address</label>
        <input
          type="text"
          id="walletInput"
          placeholder="Example: 0x29f4w1..."
        >
        <button id="analyzeBtn">Analyze Wallet</button>
      </div>

      <!-- ================= RESULT SECTION ================= -->
      <div class="result hidden" id="result"></div>

      <!-- ================= TRANSACTION CHART ================= -->
      <div id="chartContainer" class="hidden">
        <canvas id="txChart" height="120"></canvas>
      </div>

      <!-- ================= CYBER NEWS ================= -->
      <h2>Trending CyberNews :</h2>
      <div class="news">

        <a href="https://www.kaspersky.com/resource-center/definitions/what-is-cryptocurrency" target="_blank">
          <div class="card">
            <img src="images/cryptocurrencyimage11130490519670x377px300dpi.jpg" alt="Cryptocurrency">
            <h3>What is Cryptocurrency</h3>
            <p>Learn about cryptocurrency and its risks.</p>
            <span>21 days ago</span>
          </div>
        </a>

        <a href="https://www.example.com/cyber-crime-alert" target="_blank">
          <div class="card">
            <img src="images/cryptocurrencyimage11130490519670x377px300dpi.jpg" alt="Cryptocurrency">
            <h3>New Cyber Crime Alert</h3>
            <p>Million Boost to Malaysia</p>
            <span>Oct 11, 2025</span>
          </div>
        </a>

      </div>

      <!-- ================= FOOTER ================= -->
      <footer>
        Copyrights © PutraAI 2025
      </footer>

    </div>
  </div>

  <!-- Script -->
  <script src="script.js"></script>

</body>
</html>
